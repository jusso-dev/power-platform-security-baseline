id: 7d3a5c2b-6e8f-4b1a-9c40-1e6d8a2f4b01
name: Hunt - Dataverse exports by users with no prior 14-day export history
description: |
  Identifies users who performed Dataverse Excel, PDF or Word exports in the last 24 hours without any export activity over the preceding 14 days.
  Useful for surfacing first-time data staging by insiders, newly compromised accounts or external guests.
requiredDataConnectors:
  - connectorId: Dataverse
    dataTypes:
      - DataverseActivity
tactics:
  - Exfiltration
  - Collection
relevantTechniques:
  - T1567
  - T1213
query: |
  let export_messages = dynamic(["ExportToExcel", "ExportPdfDocument", "ExportWordDocument"]);
  let historical_exporters = DataverseActivity
      | where TimeGenerated between (ago(15d) .. ago(1d))
      | where Message in (export_messages)
      | distinct UserId;
  DataverseActivity
  | where TimeGenerated > ago(1d)
  | where Message in (export_messages)
  | where UserId !in (historical_exporters)
  | summarize
      Exports = count(),
      Entities = make_set(EntityName, 50),
      ClientIPs = make_set(ClientIp, 10),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by UserId, InstanceUrl, Message
  | order by Exports desc
version: 1.0.0
