id: 7d3a5c2b-6e8f-4b1a-9c40-1e6d8a2f4b05
name: Hunt - Power Automate maker activity from rare source IP addresses
description: |
  Finds Power Automate flow creations, edits, deletions or permission changes originating from source IP addresses not seen for that maker in the previous 14 days.
requiredDataConnectors:
  - connectorId: PowerAutomate
    dataTypes:
      - PowerAutomateActivity
tactics:
  - InitialAccess
  - Persistence
relevantTechniques:
  - T1078
  - T1098
query: |
  let known_maker_ips = PowerAutomateActivity
      | where TimeGenerated between (ago(15d) .. ago(1d))
      | where isnotempty(SrcIpAddr)
      | distinct ActorName, SrcIpAddr;
  PowerAutomateActivity
  | where TimeGenerated > ago(1d)
  | where isnotempty(SrcIpAddr)
  | join kind=leftanti known_maker_ips on ActorName, SrcIpAddr
  | summarize
      Events = count(),
      Operations = make_set(EventOriginalType, 10),
      Connectors = make_set(FlowConnectorNames, 20),
      Flows = make_set(FlowDetailsUrl, 10),
      FirstSeen = min(TimeGenerated),
      LastSeen = max(TimeGenerated)
      by ActorName, SrcIpAddr
  | order by Events desc
version: 1.0.0
